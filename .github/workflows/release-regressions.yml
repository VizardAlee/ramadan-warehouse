name: Release regressions
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  release-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm run test:inventory
      - run: npm run test:transfer-return-e2e
      - run: npm run test:transfer-transit-loss-e2e
      - run: npm run test:transfer-remainder-cancellation-e2e
